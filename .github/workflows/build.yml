name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install --upgrade pip buildozer cython==0.29.36 virtualenv
      - name: Build APK
        run: |
          set +e
          buildozer -v android debug > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo "=== ERROR LINES ==="
            grep -v "^# " build.log | grep -n -i -E "error|failed|not found|exception|no such" | tail -30
            echo "=== LAST 40 LINES ==="
            grep -v "^# " build.log | tail -40
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: NoticeBoard-APK
          path: bin/*.apk